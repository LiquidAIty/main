services:
  postgres:
    image: apache/age:release_PG16_1.6.0
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-liquidaity}
      - POSTGRES_USER=${POSTGRES_USER:-liquidaity-user}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing_required_config: POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      - "NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?missing_required_config: NEO4J_PASSWORD}"
      - NEO4J_PLUGINS=["apoc","apoc-extended"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "auth=\"$${NEO4J_AUTH}\"; /var/lib/neo4j/bin/cypher-shell -a bolt://127.0.0.1:7687 -u \"$${auth%%/*}\" -p \"$${auth#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 15s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  honcho-api:
    build:
      context: https://github.com/plastic-labs/honcho.git#82a92429b888727b2236820b863256067c7edc80
      dockerfile: Dockerfile
    container_name: liquidaity-honcho-api
    entrypoint: ["sh", "-c", "export LLM_OPENAI_API_KEY=\"$${OPENROUTER_API_KEY}\"; exec sh docker/entrypoint.sh"]
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@honcho-database:5432/postgres
      - CACHE_URL=redis://honcho-redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - AUTH_USE_AUTH=false
      - EMBED_MESSAGES=false
      - DERIVER_MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - SUMMARY_MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DREAM_ENABLED=false
      - SENTRY_ENABLED=false
      - METRICS_ENABLED=false
      - TELEMETRY_ENABLED=false
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  honcho-deriver:
    build:
      context: https://github.com/plastic-labs/honcho.git#82a92429b888727b2236820b863256067c7edc80
      dockerfile: Dockerfile
    container_name: liquidaity-honcho-deriver
    entrypoint: ["sh", "-c", "export LLM_OPENAI_API_KEY=\"$${OPENROUTER_API_KEY}\"; exec /app/.venv/bin/python -m src.deriver"]
    depends_on:
      honcho-api:
        condition: service_healthy
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@honcho-database:5432/postgres
      - CACHE_URL=redis://honcho-redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - EMBED_MESSAGES=false
      - DERIVER_MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - SUMMARY_MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=openai/gpt-5.4-mini
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL=https://openrouter.ai/api/v1
      - DREAM_ENABLED=false
      - SENTRY_ENABLED=false
      - METRICS_ENABLED=false
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

  honcho-database:
    image: pgvector/pgvector:pg15
    container_name: liquidaity-honcho-database
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./db/honcho-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - honcho_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  honcho-redis:
    image: redis:8.2
    container_name: liquidaity-honcho-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
    name: sim-pg-data
  neo4j_data:
  neo4j_logs:
  honcho_postgres_data:
  honcho_redis_data:
