services:
  codegraph:
    image: liquidaity-codegraph:0.10.8
    container_name: codegraph
    build:
      context: .
      dockerfile: Dockerfile.codegraph
      args:
        CBM_VERSION: "0.10.8"
        CBM_RELEASE_SHA256: 6EEF49652BC0C7820F43114125044D40BF7F4D97C11B2592F6B0F6A307702325
        CBM_BINARY_SHA256: 1175645CB30560E7E47D78611CD1BCB509478EAF6D4E51F72FE18327EE9C1351
    init: true
    working_dir: /C/Projects/LiquidAIty/main
    volumes:
      - .:/C/Projects/LiquidAIty/main:ro
      - codegraph_data:/root/.cache/codebase-memory-mcp
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(/opt/cbm/codebase-memory-mcp --version)\" = \"codebase-memory-mcp 0.10.8\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: apache/age:release_PG16_1.6.0
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-liquidaity}
      - POSTGRES_USER=${POSTGRES_USER:-liquidaity-user}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing_required_config: POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      - "NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?missing_required_config: NEO4J_PASSWORD}"
      - NEO4J_PLUGINS=["apoc","apoc-extended"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "auth=\"$${NEO4J_AUTH}\"; /var/lib/neo4j/bin/cypher-shell -a bolt://127.0.0.1:7687 -u \"$${auth%%/*}\" -p \"$${auth#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 15s
      retries: 60
      start_period: 20s
    restart: unless-stopped

volumes:
  codegraph_data:
    name: liquidaity-cbm-cache
  postgres_data:
    name: sim-pg-data
  neo4j_data:
  neo4j_logs:
