services:
  postgres:
    image: apache/age:release_PG16_1.6.0
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-liquidaity}
      - POSTGRES_USER=${POSTGRES_USER:-liquidaity-user}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing_required_config: POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      - "NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?missing_required_config: NEO4J_PASSWORD}"
      - NEO4J_PLUGINS=["apoc","apoc-extended"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "auth=\"$${NEO4J_AUTH}\"; /var/lib/neo4j/bin/cypher-shell -a bolt://127.0.0.1:7687 -u \"$${auth%%/*}\" -p \"$${auth#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 15s
      retries: 60
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    name: sim-pg-data
  neo4j_data:
  neo4j_logs:
