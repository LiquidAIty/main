memory:
  provider: holographic
plugins:
  hermes-memory-store:
    db_path: $HERMES_HOME/memory_store.db
    auto_extract: false
    default_trust: 0.5
    min_trust_threshold: 0.3
    hrr_dim: 1024
    temporal_decay_half_life: 0
model:
  default: gpt-5.6-luna
  provider: openai-codex
mcp_servers:
  liquidaity:
    url: http://127.0.0.1:8765/mcp
    headers:
      Authorization: Bearer ${LIQUIDAITY_CODER_MCP_BEARER}
    tools:
      include:
        - cbm.search_graph
      resources: false
      prompts: false
    connect_timeout: 30
onboarding:
  seen:
    tool_progress_prompt: true
terminal:
  cwd: 'C:\Projects\LiquidAIty\main'
