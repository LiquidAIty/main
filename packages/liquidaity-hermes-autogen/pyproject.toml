[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidaity-hermes-autogen"
version = "0.1.0"
description = "LiquidAIty AutoGen subagent tool for Hermes"
requires-python = ">=3.11"

[project.entry-points."hermes_agent.plugins"]
liquidaity-autogen = "liquidaity_hermes_autogen:register"

[tool.setuptools.packages.find]
where = ["src"]
