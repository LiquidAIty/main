plugins:
  hermes-memory-store:
    db_path: $HERMES_HOME/memory_store.db
    auto_extract: false
    default_trust: 0.5
    min_trust_threshold: 0.3
    hrr_dim: 1024
    temporal_decay_half_life: 0
  enabled:
    - liquidaity-card-mcp
  disabled: []
  entries:
    liquidaity-card-mcp:
      allow_tool_override: false
tools:
  enabled_toolsets:
    - delegation
    - memory
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 38
